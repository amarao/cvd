version: 1
inventory: [inventory.yml]
scenarios:
  native:
    create:
      ansible:
        playbook: create.yml
    prepare:
      ansible:
        playbook: converge.yml
    converge:
      ansible:
        playbook: converge.yml
    verify:
      inventory:
        pytest:
          path: test_inventory.py
          args: ["-q"]
    cleanup:
      ansible:
        playbook: converge.yml
    destroy:
      ansible:
        playbook: destroy.yml
