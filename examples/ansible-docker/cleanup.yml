---
- name: Clean up test changes before destroying the containers
  hosts: webservers
  gather_facts: false
  tasks:
    - name: Remove the greeting if convergence created it
      ansible.builtin.raw: |
        if [ -e /tmp/cvd-greeting ]; then
          rm /tmp/cvd-greeting && printf 'removed\n'
        fi
      register: cleanup_greeting
      changed_when: "'removed' in cleanup_greeting.stdout"
