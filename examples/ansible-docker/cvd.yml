version: 1
inventory: [inventory.yml]
provisioner: ansible
converger: ansible
verifier: pytest

scenarios:
  scenario_id_1:
    create:
      ansible:
        playbook: create.yml
    converge:
      ansible:
        playbook: converge.yml
    verify:
      greeting:
        pytest:
          path: tests/test_web.py
          args: ["-v"]
    destroy:
      ansible:
        playbook: destroy.yml
