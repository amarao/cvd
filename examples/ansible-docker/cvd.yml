version: 1
inventory: [inventory.yml]

scenarios:
  web_greeting:  # scenario name
    create:
      ansible: # provisioner type
        playbook: create.yml
    prepare:
      ansible: # converger type
        playbook: prepare.yml
    converge:
      ansible: # converger type
        playbook: converge.yml
    verify:
      greeting_ansible: # name of the verifier run
        ansible:
          playbook: verify.yml
      greeting:
        pytest:
          path: tests/test_web.py
          args: ["-v"]
    # cleanup:
    #   ansible:
    #     playbook: cleanup.yml
    destroy:
      ansible:
        playbook: destroy.yml
