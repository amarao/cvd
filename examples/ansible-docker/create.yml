---
# Example of managing non-host resources
- name: Build an image owned by this scenario invocation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Choose a unique image reference
      ansible.builtin.set_fact:
        cvd_image_reference: "cvd-example:{{ cvd.invocation_id }}"

    - name: Build the example image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --tag
          - "{{ cvd_image_reference }}"
          - --label
          - "cvd.invocation_id={{ cvd.invocation_id }}"
          - "{{ playbook_dir }}"
      changed_when: true

    - name: Inspect the built image
      ansible.builtin.command:
        argv: [docker, image, inspect, "{{ cvd_image_reference }}"]
      register: image_inspect
      changed_when: false

    - name: Record the image as a non-host resource
      ansible.builtin.set_fact:
        cvd_images:
          - id: "{{ (image_inspect.stdout | from_json)[0].Id }}"
            type: docker.image
            attributes:
              reference: "{{ cvd_image_reference }}"

# Example of managing host-like resources
- name: Create containers declared in the managed inventory group
  hosts: cvd_managed
  connection: local
  gather_facts: false
  tasks:
    - name: Start a container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --detach
          - --name
          - "cvd-{{ inventory_hostname }}-{{ cvd.invocation_id }}"
          # Docker allocates a loopback port per container so hosts and runs can coexist.
          - --publish
          - "127.0.0.1::8080"
          - "{{ hostvars['localhost'].cvd_image_reference }}"
      register: docker_run
      changed_when: true

    - name: Discover the HTTP address reachable from the controller
      ansible.builtin.command:
        argv: [docker, port, "{{ docker_run.stdout }}", 8080/tcp]
      register: docker_http_address
      changed_when: false

    - name: Describe the created resource and its runtime host connection
      ansible.builtin.set_fact:
        cvd_resource:
          id: "{{ docker_run.stdout }}"
          type: docker.container
          attributes:
            ansible:
              inventory_hostname: "{{ inventory_hostname }}"
              vars:
                ansible_host: "{{ docker_run.stdout }}"
                ansible_connection: community.docker.docker
                http_url: "http://{{ docker_http_address.stdout | trim }}/"

- name: Publish the aggregate manifest on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Publish containers and the built image atomically
      ansible.builtin.copy:
        dest: "{{ cvd.result_file }}"
        mode: "0600"
        content: >-
          {{
            {
              'manifest_version': 1,
              'invocation_id': cvd.invocation_id,
              'complete': true,
              'resources': (groups['cvd_managed'] | map('extract', hostvars, 'cvd_resource') | list)
                           + (cvd_images | unique(attribute='id') | list)
            } | to_nice_json
          }}
