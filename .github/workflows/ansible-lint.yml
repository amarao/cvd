name: Ansible Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Lint Ansible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ansible Lint
        run: python -m pip install ansible-lint
      - name: Run Ansible Lint
        run: |
          mapfile -t playbooks < <(
            find examples tests/fixtures -type f \( \
              -name 'create.yml' -o \
              -name 'prepare.yml' -o \
              -name 'converge.yml' -o \
              -name 'cleanup.yml' -o \
              -name 'destroy.yml' -o \
              -name 'verify.yml' \
            \) | sort
          )
          ansible-lint "${playbooks[@]}"
